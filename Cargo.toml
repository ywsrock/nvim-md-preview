[package]
name = "nvim-md-preview"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nvim-md-preview"
path = "src/main.rs"

[dependencies]
# 非同期ランタイム
tokio = { version = "1", features = ["full"] }

# HTTP + WebSocket サーバー
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }

# Markdown → HTML 変換
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# JSON シリアライズ
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# msgpack-rpc（nvim-rs の代替、Windows 対応）
rmpv = "1"
bytes = "1"

[profile.release]
opt-level = "z"      # サイズ最優先（"s" より小さい）
lto = "fat"          # リンク時最適化（最大限）
codegen-units = 1    # 並列コンパイルを無効にしてより細かく最適化
strip = true         # デバッグシンボルを除去
panic = "abort"      # unwind テーブルを除去（数百KB削減）
