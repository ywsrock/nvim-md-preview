name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ hashFiles('Cargo.lock') }}

      # build.rs が src/embedded_lib/ の存在を要求する
      - name: Download JS libraries
        run: bash download-libs.sh

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true

      # :MdPreviewInstall はプラグインの版の Release を取得するので、両方の版がずれないようにする
      - name: Version check
        run: |
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          LUA=$(sed -n 's/^M.version = "\(.*\)"$/\1/p' lua/md_preview.lua)
          echo "Cargo.toml: $CARGO, lua/md_preview.lua: $LUA"
          [ -n "$CARGO" ] && [ "$CARGO" = "$LUA" ] || { echo "::error::Cargo.toml ($CARGO) and M.version in lua/md_preview.lua ($LUA) must match"; exit 1; }

      - name: Smoke test
        run: nvim --headless -u NONE -c "luafile tests/smoke.lua" -c "qa!"
