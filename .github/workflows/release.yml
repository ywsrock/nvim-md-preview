name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nvim-md-preview
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nvim-md-preview
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nvim-md-preview
          # NOTE: Windows ネイティブは nvim-rs の依存クレートが未対応
          # Windows ユーザーは WSL + Linux バイナリを使用してください

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Download JS libraries
        run: bash download-libs.sh

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact }} nvim-md-preview-${{ matrix.target }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: nvim-md-preview-${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
