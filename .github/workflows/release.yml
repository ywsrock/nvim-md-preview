name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nvim-md-preview
            pandoc_bin: pandoc-linux
            typst_url: https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz
            typst_bin: typst-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nvim-md-preview
            pandoc_bin: pandoc-macos-x86_64
            typst_url: https://github.com/typst/typst/releases/latest/download/typst-x86_64-apple-darwin.tar.xz
            typst_bin: typst-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nvim-md-preview
            pandoc_bin: pandoc-macos-arm64
            typst_url: https://github.com/typst/typst/releases/latest/download/typst-aarch64-apple-darwin.tar.xz
            typst_bin: typst-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nvim-md-preview.exe
            pandoc_bin: pandoc-windows.exe
            typst_url: https://github.com/typst/typst/releases/latest/download/typst-x86_64-pc-windows-msvc.zip
            typst_bin: typst-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Download JS libraries (Unix)
        if: runner.os != 'Windows'
        run: bash download-libs.sh

      - name: Download JS libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/embedded_lib/fonts | Out-Null
          $base = "https://cdn.jsdelivr.net"
          function DL($url, $out) { Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing }
          function DLGz($url, $out) {
            $tmp = [System.IO.Path]::GetTempFileName()
            Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing
            $bytes = [System.IO.File]::ReadAllBytes($tmp)
            $ms = New-Object System.IO.MemoryStream
            $gz = New-Object System.IO.Compression.GZipStream($ms, [System.IO.Compression.CompressionMode]::Compress)
            $gz.Write($bytes, 0, $bytes.Length); $gz.Close()
            [System.IO.File]::WriteAllBytes($out, $ms.ToArray())
            Remove-Item $tmp
          }
          DLGz "$base/gh/highlightjs/cdn-release@11/build/highlight.min.js"          "src/embedded_lib/highlight.min.js.gz"
          DLGz "$base/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css" "src/embedded_lib/hljs-dark.min.css.gz"
          DLGz "$base/gh/highlightjs/cdn-release@11/build/styles/github.min.css"      "src/embedded_lib/hljs-light.min.css.gz"
          DLGz "$base/npm/mermaid@11/dist/mermaid.min.js"                             "src/embedded_lib/mermaid.min.js.gz"
          DLGz "$base/npm/katex@0.16/dist/katex.min.js"                               "src/embedded_lib/katex.min.js.gz"
          DLGz "$base/npm/katex@0.16/dist/contrib/auto-render.min.js"                 "src/embedded_lib/auto-render.min.js.gz"
          $css = (Invoke-WebRequest -Uri "$base/npm/katex@0.16/dist/katex.min.css" -UseBasicParsing).Content
          $css = $css -replace 'url\(fonts/', 'url(/lib/fonts/'
          $enc = [System.Text.Encoding]::UTF8.GetBytes($css)
          $ms = New-Object System.IO.MemoryStream
          $gz = New-Object System.IO.Compression.GZipStream($ms, [System.IO.Compression.CompressionMode]::Compress)
          $gz.Write($enc, 0, $enc.Length); $gz.Close()
          [System.IO.File]::WriteAllBytes("src/embedded_lib/katex.min.css.gz", $ms.ToArray())
          $fonts = @(
            "KaTeX_AMS-Regular","KaTeX_Caligraphic-Bold","KaTeX_Caligraphic-Regular",
            "KaTeX_Fraktur-Bold","KaTeX_Fraktur-Regular","KaTeX_Main-Bold",
            "KaTeX_Main-BoldItalic","KaTeX_Main-Italic","KaTeX_Main-Regular",
            "KaTeX_Math-BoldItalic","KaTeX_Math-Italic","KaTeX_SansSerif-Bold",
            "KaTeX_SansSerif-Italic","KaTeX_SansSerif-Regular","KaTeX_Script-Regular",
            "KaTeX_Size1-Regular","KaTeX_Size2-Regular","KaTeX_Size3-Regular",
            "KaTeX_Size4-Regular","KaTeX_Typewriter-Regular"
          )
          foreach ($f in $fonts) {
            DL "$base/npm/katex@0.16/dist/fonts/${f}.woff2" "src/embedded_lib/fonts/${f}.woff2"
          }

      - name: Build nvim-md-preview
        run: cargo build --release --target ${{ matrix.target }}

      # ── pandoc を取得してシングルバイナリとしてリリースに含める ──

      - name: Extract pandoc (Linux)
        if: runner.os == 'Linux'
        run: |
          VER=$(curl -sL https://api.github.com/repos/jgm/pandoc/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL -o pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${VER}/pandoc-${VER}-linux-amd64.tar.gz"
          tar -xzf pandoc.tar.gz --wildcards "*/bin/pandoc" --strip-components=2
          mv pandoc ${{ matrix.pandoc_bin }}
          chmod +x ${{ matrix.pandoc_bin }}

      - name: Extract pandoc (macOS x86_64)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          VER=$(curl -sL https://api.github.com/repos/jgm/pandoc/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/${VER}/pandoc-${VER}-x86_64-macOS.zip"
          unzip -jo pandoc.zip "*/bin/pandoc" -d .
          mv pandoc ${{ matrix.pandoc_bin }}
          chmod +x ${{ matrix.pandoc_bin }}

      - name: Extract pandoc (macOS arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          VER=$(curl -sL https://api.github.com/repos/jgm/pandoc/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/${VER}/pandoc-${VER}-arm64-macOS.zip"
          unzip -jo pandoc.zip "*/bin/pandoc" -d .
          mv pandoc ${{ matrix.pandoc_bin }}
          chmod +x ${{ matrix.pandoc_bin }}

      - name: Extract pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest -Uri "https://api.github.com/repos/jgm/pandoc/releases/latest" -UseBasicParsing).Content | ConvertFrom-Json | Select-Object -ExpandProperty tag_name
          $url = "https://github.com/jgm/pandoc/releases/download/$ver/pandoc-$ver-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile pandoc.zip -UseBasicParsing
          Expand-Archive -Path pandoc.zip -DestinationPath pandoc_tmp -Force
          $src = Get-ChildItem -Path pandoc_tmp -Filter "pandoc.exe" -Recurse | Select-Object -First 1
          Copy-Item $src.FullName -Destination "${{ matrix.pandoc_bin }}"
          Remove-Item -Recurse -Force pandoc_tmp, pandoc.zip

      # ── Typst を取得してシングルバイナリとしてリリースに含める ──

      - name: Extract typst (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o typst.tar.xz "${{ matrix.typst_url }}"
          tar -xJf typst.tar.xz --strip-components=1 --wildcards "*/typst"
          mv typst ${{ matrix.typst_bin }}
          chmod +x ${{ matrix.typst_bin }}

      - name: Extract typst (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o typst.tar.xz "${{ matrix.typst_url }}"
          tar -xJf typst.tar.xz --strip-components=1 --wildcards "*/typst"
          mv typst ${{ matrix.typst_bin }}
          chmod +x ${{ matrix.typst_bin }}

      - name: Extract typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.typst_url }}" -OutFile typst.zip -UseBasicParsing
          Expand-Archive -Path typst.zip -DestinationPath typst_tmp -Force
          $src = Get-ChildItem -Path typst_tmp -Filter "typst.exe" -Recurse | Select-Object -First 1
          Copy-Item $src.FullName -Destination "${{ matrix.typst_bin }}"
          Remove-Item -Recurse -Force typst_tmp, typst.zip

      # ── リリースにアップロード ──

      - name: Rename nvim-md-preview (Unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact }} nvim-md-preview-${{ matrix.target }}

      - name: Rename nvim-md-preview (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item target/${{ matrix.target }}/release/${{ matrix.artifact }} nvim-md-preview-${{ matrix.target }}.exe

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nvim-md-preview-${{ matrix.target }}*
            ${{ matrix.pandoc_bin }}
            ${{ matrix.typst_bin }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
