name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # pandoc / typst のバージョンを一度だけ解決し、全プラットフォームで同じものを同梱する
  versions:
    runs-on: ubuntu-latest
    outputs:
      pandoc: ${{ steps.resolve.outputs.pandoc }}
      typst: ${{ steps.resolve.outputs.typst }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PANDOC=$(gh api repos/jgm/pandoc/releases/latest --jq .tag_name)
          TYPST=$(gh api repos/typst/typst/releases/latest --jq .tag_name)
          [ -n "$PANDOC" ] || { echo "::error::failed to resolve pandoc version"; exit 1; }
          [ -n "$TYPST" ]  || { echo "::error::failed to resolve typst version"; exit 1; }
          echo "pandoc=$PANDOC" >> "$GITHUB_OUTPUT"
          echo "typst=$TYPST"   >> "$GITHUB_OUTPUT"
          echo "pandoc $PANDOC / typst $TYPST"

  # 下書きの Release を作る。各ビルドはここにファイルを追加し、全部そろってから公開する
  # （このリポジトリの Release は公開後に変更できないため、公開してから追加すると失敗する）
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          # CHANGELOG の "## [VERSION]" の節をリリースノートにする
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          elif [ -s notes.md ]; then
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

  build:
    needs: [versions, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nvim-md-preview
            pandoc_bin: pandoc-linux
            pandoc_asset: linux-amd64.tar.gz
            typst_asset: typst-x86_64-unknown-linux-musl.tar.xz
            typst_bin: typst-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: nvim-md-preview
            pandoc_bin: pandoc-linux-arm64
            pandoc_asset: linux-arm64.tar.gz
            typst_asset: typst-aarch64-unknown-linux-musl.tar.xz
            typst_bin: typst-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nvim-md-preview
            pandoc_bin: pandoc-macos-x86_64
            pandoc_asset: x86_64-macOS.zip
            typst_asset: typst-x86_64-apple-darwin.tar.xz
            typst_bin: typst-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nvim-md-preview
            pandoc_bin: pandoc-macos-arm64
            pandoc_asset: arm64-macOS.zip
            typst_asset: typst-aarch64-apple-darwin.tar.xz
            typst_bin: typst-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nvim-md-preview.exe
            pandoc_bin: pandoc-windows.exe
            pandoc_asset: windows-x86_64.zip
            typst_asset: typst-x86_64-pc-windows-msvc.zip
            typst_bin: typst-windows.exe

    runs-on: ${{ matrix.os }}

    env:
      PANDOC_VERSION: ${{ needs.versions.outputs.pandoc }}
      TYPST_VERSION: ${{ needs.versions.outputs.typst }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      # Windows でも Git for Windows の bash で同じスクリプトを使う
      - name: Download JS libraries
        shell: bash
        run: bash download-libs.sh

      - name: Build nvim-md-preview
        run: cargo build --release --target ${{ matrix.target }}

      # ── pandoc を取得してシングルバイナリとしてリリースに含める ──

      - name: Extract pandoc (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ASSET="pandoc-${PANDOC_VERSION}-${{ matrix.pandoc_asset }}"
          curl -fsSL --retry 3 -o "$ASSET" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${ASSET}"
          mkdir pandoc_tmp
          case "$ASSET" in
            *.tar.gz) tar -xzf "$ASSET" -C pandoc_tmp ;;
            *.zip)    unzip -q "$ASSET" -d pandoc_tmp ;;
          esac
          FOUND=$(find pandoc_tmp -type f -path '*/bin/pandoc')
          [ "$(printf '%s\n' "$FOUND" | grep -c .)" -eq 1 ] || { echo "::error::expected exactly one bin/pandoc, got: $FOUND"; exit 1; }
          mv "$FOUND" ${{ matrix.pandoc_bin }}
          chmod +x ${{ matrix.pandoc_bin }}
          rm -rf pandoc_tmp "$ASSET"

      - name: Extract pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "pandoc-$env:PANDOC_VERSION-${{ matrix.pandoc_asset }}"
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/$asset" -OutFile pandoc.zip -UseBasicParsing -MaximumRetryCount 3
          Expand-Archive -Path pandoc.zip -DestinationPath pandoc_tmp -Force
          $src = @(Get-ChildItem -Path pandoc_tmp -Filter "pandoc.exe" -Recurse)
          if ($src.Count -ne 1) { throw "expected exactly one pandoc.exe, got $($src.Count)" }
          Copy-Item $src[0].FullName -Destination "${{ matrix.pandoc_bin }}"
          Remove-Item -Recurse -Force pandoc_tmp, pandoc.zip

      # ── Typst を取得してシングルバイナリとしてリリースに含める ──

      - name: Extract typst (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o typst.tar.xz "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/${{ matrix.typst_asset }}"
          mkdir typst_tmp
          tar -xJf typst.tar.xz -C typst_tmp
          FOUND=$(find typst_tmp -type f -name typst)
          [ "$(printf '%s\n' "$FOUND" | grep -c .)" -eq 1 ] || { echo "::error::expected exactly one typst binary, got: $FOUND"; exit 1; }
          mv "$FOUND" ${{ matrix.typst_bin }}
          chmod +x ${{ matrix.typst_bin }}
          rm -rf typst_tmp typst.tar.xz

      - name: Extract typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/typst/typst/releases/download/$env:TYPST_VERSION/${{ matrix.typst_asset }}" -OutFile typst.zip -UseBasicParsing -MaximumRetryCount 3
          Expand-Archive -Path typst.zip -DestinationPath typst_tmp -Force
          $src = @(Get-ChildItem -Path typst_tmp -Filter "typst.exe" -Recurse)
          if ($src.Count -ne 1) { throw "expected exactly one typst.exe, got $($src.Count)" }
          Copy-Item $src[0].FullName -Destination "${{ matrix.typst_bin }}"
          Remove-Item -Recurse -Force typst_tmp, typst.zip

      # ── :MdPreviewInstall のダウンロード量を減らすため tar.gz 版も作る ──
      # 中身は pandoc / typst（Windows は .exe 付き）1 ファイルのみ。展開先にそのまま置ける

      - name: Package pandoc / typst as tar.gz
        shell: bash
        run: |
          set -euo pipefail
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          for pair in "pandoc:${{ matrix.pandoc_bin }}" "typst:${{ matrix.typst_bin }}"; do
            TOOL="${pair%%:*}"; BIN="${pair#*:}"
            mkdir -p "pkg_$TOOL"
            cp "$BIN" "pkg_$TOOL/$TOOL$EXE"
            tar -cf - -C "pkg_$TOOL" "$TOOL$EXE" | gzip -9 > "${BIN%.exe}.tar.gz"
            rm -rf "pkg_$TOOL"
            ls -l "$BIN" "${BIN%.exe}.tar.gz"
          done

      # ── リリースにアップロード ──

      - name: Rename nvim-md-preview (Unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/${{ matrix.artifact }} nvim-md-preview-${{ matrix.target }}

      - name: Rename nvim-md-preview (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item target/${{ matrix.target }}/release/${{ matrix.artifact }} nvim-md-preview-${{ matrix.target }}.exe

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" --clobber \
            nvim-md-preview-${{ matrix.target }}* \
            "${{ matrix.pandoc_bin }}" "${{ matrix.typst_bin }}" \
            pandoc-*.tar.gz typst-*.tar.gz

  # すべてのビルドが成功したときだけ公開する（1 つでも失敗すれば下書きのまま残る）
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
